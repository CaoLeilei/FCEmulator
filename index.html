<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FC 模拟器</title>
</head>

<body>
  <div id="app">
    <!-- 主容器 -->
    <div class="emulator-container">
      <!-- 游戏画布区域 -->
      <div class="game-area">
        <canvas id="game-canvas" width="256" height="240"></canvas>

        <!-- 控制按钮 -->
        <div class="controls">
          <button id="play-button" class="btn btn-primary">▶️ 播放</button>
          <button id="pause-button" class="btn btn-secondary">⏸️ 暂停</button>
          <button id="reset-button" class="btn btn-warning">🔄 重置</button>
          <button id="step-button" class="btn btn-info">⏭️ 单步</button>
        </div>
      </div>

      <!-- 侧边栏 -->
      <div class="sidebar">
        <!-- ROM 加载 -->
        <div class="panel">
          <h3>ROM 管理</h3>
          <div class="rom-loader">
            <input type="file" id="rom-file" accept=".nes" style="display: none;">
            <button id="load-button" class="btn btn-primary">📁 加载 ROM</button>
            <div id="rom-info" class="rom-info"></div>
          </div>
        </div>

        <!-- 显示设置 -->
        <div class="panel">
          <h3>显示设置</h3>
          <div class="setting-group">
            <label for="scale-select">缩放:</label>
            <select id="scale-select" class="select">
              <option value="1">1x</option>
              <option value="2" selected>2x</option>
              <option value="3">3x</option>
              <option value="4">4x</option>
            </select>
          </div>
          <div class="setting-group">
            <button id="fullscreen-button" class="btn btn-secondary">🖥️ 全屏</button>
          </div>
        </div>

        <!-- 音频控制 -->
        <div class="panel">
          <h3>音频设置</h3>
          <div class="setting-group">
            <label for="volume-slider">音量:</label>
            <input type="range" id="volume-slider" min="0" max="100" value="50" class="slider">
            <button id="mute-button" class="btn btn-secondary">🔇 静音</button>
          </div>
        </div>

        <!-- 调试信息 -->
        <div class="panel">
          <h3>状态信息</h3>
          <div class="debug-info">
            <div id="fps-display">FPS: --</div>
            <div id="cycle-display">周期: 0</div>
            <div id="controller-display">手柄: 等待输入</div>
          </div>
          <button id="debug-toggle" class="btn btn-secondary">🔧 调试面板</button>
        </div>
      </div>
    </div>

    <!-- 调试面板 -->
    <div id="debug-panel" class="debug-panel hidden">
      <h3>调试面板</h3>
      <div class="debug-grid">
        <div class="debug-section">
          <h4>图案表</h4>
          <canvas id="pattern-table-1" width="128" height="128"></canvas>
          <canvas id="pattern-table-2" width="128" height="128"></canvas>
        </div>
        <div class="debug-section">
          <h4>名称表</h4>
          <canvas id="nametable-1" width="256" height="240"></canvas>
          <canvas id="nametable-2" width="256" height="240"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- 消息容器 -->
  <div id="message-container"></div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
